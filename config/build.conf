#!/usr/bin/env bash
# ============================================================================
#  Основная конфигурация сборки дистрибутива на базе Linux Mint.
#
#  Главное: задайте SOURCE_ISO (путь к ISO-образу Linux Mint), остальное
#  меняйте по желанию. Любое значение можно переопределить и передачей
#  переменной окружения, например:
#      SOURCE_ISO=/home/user/mint.iso DISTRO_NAME=MyMint ./build.sh
# ============================================================================

# -- Базовый ISO-образ Linux Mint --------------------------------------------
: "${SOURCE_ISO:=/home/username/iso-64bit.iso}"

# -- Идентичность нового дистрибутива ----------------------------------------
# Короткое имя (латиница, без пробелов) - уходит в имя файла и брендирование
: "${DISTRO_NAME:=MyLInux}"
# Версия дистрибутива
: "${DISTRO_VERSION:=1.0}"
# Метка тома ISO (не более 32 симв., латиница)
: "${ISO_VOLID:=MyLInux_1.0}"
# Издатель (пишется в метаданные ISO)
: "${ISO_PUBLISHER:=MyOrg}"
# Имя хоста для устанавливаемой системы
: "${DEFAULT_HOSTNAME:=mymint}"

# -- Каталоги ----------------------------------------------------------------
# Рабочий каталог сборки. Свободного места на диске нужно не меньше 2-3
# размеров базового ISO (каталог активен: туда распакуется образ и rootfs).
: "${WORKDIR:=/opt/mint-build/${DISTRO_NAME}}"
# Каталог для ГОТОВОГО образа (внутри папки проекта) и итоговый ISO-файл
: "${OUTPUT_DIR:=$ROOT_DIR/output}"
: "${OUTPUT_ISO:=$OUTPUT_DIR/${DISTRO_NAME}-${DISTRO_VERSION}-amd64.iso}"

# -- Управление составом пакетов ---------------------------------------------
# Списки пакетов (по одному имени в строке, строки '#' игнорируются):
: "${PACKAGES_REMOVE_LIST:=$CONFIG_DIR/packages-remove.list}"   # что убрать из базовой сборки
: "${PACKAGES_ADD_LIST:=$CONFIG_DIR/packages-add.list}"         # что доустановить из официальных репо
# Каталог с .deb-пакетами, которые будут установлены ВНУТРЬ сборки
# ДО упаковки squashfs (dpkg -i, затем автоматически чинятся зависимости):
: "${DEB_DIR:=$CONFIG_DIR/deb}"

# -- Брендирование -----------------------------------------------------------
# Каталог с материалами бренда (см. brand/README):
#   brand/root/  - оверлей поверх live-файловой системы внутри squashfs
#                   (пути СИСТЕМНЫЕ, например usr/share/backgrounds/fon.png)
#   brand/iso/   - файлы, копируемые в корень ISO (картинки, README, шрифты grub)
#   brand/boot/  - опциональная ПОЛНАЯ замена boot/grub/grub.cfg и isolinux/isolinux.cfg
: "${BRAND_DIR:=$ROOT_DIR/brand}"

# -- Хранилище готовых образов и логи сборки -------------------------------
# Сколько последних ISO-образов хранить в output/. Более старые автоматически
# удаляются на стадии "prune" (выполняется перед сборкой нового образа).
: "${BUILD_KEEP:=3}"
# Каталог логов сборки (в него пишется полный протокол каждого запуска)
: "${BUILD_LOG_DIR:=$OUTPUT_DIR/logs}"

# -- Прочее ------------------------------------------------------------------
# 1 = не чистить рабочий каталог после сборки (полезно для итераций)
: "${KEEP_WORK:=1}"
